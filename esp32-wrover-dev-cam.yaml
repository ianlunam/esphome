# Board: Espressif ESP-WROVER-KIT
# Definition: definitions/boards/esp-wrover-kit/manifest.yaml

esphome:
  name: wrover-cam
  friendly_name: Wrover Cam

esp32:
  variant: esp32

logger:

api:
  encryption:
    key: ••••••••••••••••••••••••••••••••••••••••••••••

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Wrover Cam Fallback Hotspot
    password: ••••••••••••••

captive_portal:

psram:

i2c:
  id: camera_bus
  sda: GPIO26
  scl: GPIO27
  scan: true

esp32_camera:
  name: Wrover Cam
  i2c_id: camera_bus
  external_clock:
    pin: GPIO21
    frequency: 20MHz
  data_pins: [GPIO4, GPIO5, GPIO18, GPIO19, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  resolution: 640x480
  jpeg_quality: 12
  max_framerate: 10 fps

web_server:
  port: 80
