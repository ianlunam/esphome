                name: Monday
                icon: mdi:alpha-m-box
                show_name: false
              - entity: switch.alarm_clock_alarm_1_tuesday
                name: Tuesday
                icon: mdi:alpha-t-box
                show_name: false
              - entity: switch.alarm_clock_alarm_1_wednesday
                name: Wednesday
                icon: mdi:alpha-w-box
                show_name: false
              - entity: switch.alarm_clock_alarm_1_thursday
                name: Thursday
                icon: mdi:alpha-t-box
                show_name: false
              - entity: switch.alarm_clock_alarm_1_friday
                name: Friday
                icon: mdi:alpha-f-box
                show_name: false
              - entity: switch.alarm_clock_alarm_1_saturday
                name: Saturday
                icon: mdi:alpha-s-box
                show_name: false
              - entity: switch.alarm_clock_alarm_1_sunday
                name: Sunday
                icon: mdi:alpha-s-box
                show_name: false
          - type: buttons
            entities:
